<!DOCTYPE html>
<html>
    <head>
        <title>TaskFlow</title>
        <link rel="stylesheet" href="css/style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <header>
            <div class="container">
                <p class="logo">TaskFlow</p>
                <button type="button" class="new-proj-btn">+ New</button> <!--Make so drop down can appear for new project or new task to active project-->
            </div>
        </header>

        <div class="container">
            <nav class="dash-nav" aria-label="Main navigation">
                <ul class="nav">
                    <li><a>Dashboard</a></li>
                    <li><a>Projects</a></li>
                    <li><a>Archives</a></li>
                    <li><a>Trash</a></li>
                </ul>
            </nav>

            <main class="dashboard">
                <h1>Dashboard</h1>
                <section class="ttl-stats">
                    <h2>Statistics</h2>
                    <div class="stat-card total">
                        <h3>Total</h3>
                        <p>0</p>
                    </div>

                    <div class="stat-card in-progress">
                        <h3>In Progress</h3>
                        <p>0</p>
                    </div>

                    <div class="stat-card review">
                        <h3>Review</h3>
                        <p>0</p>
                    </div>

                    <div class="stat-card completed">
                        <h3>Completed</h3>
                        <p>0</p>
                    </div>
                </section>

                <div class="dash-ctrl">
                    <button type="button" class="ctrl-btn search">Search</button>

                    <button type="button" class="ctrl-btn filter">Filter</button>

                    <button type="button" class="ctrl-btn sort">Sort</button>
                </div>

                <h2>Recently Active Project</h2>

                <section class="task-board">
                    <div class="task-column todo">
                        <h3>To Do</h3>
                        <p>0</p>
                    </div>

                    <div class="task-column in-progress">
                        <h3>In Progress</h3>
                        <p>0</p>
                    </div>

                    <div class="task-column review">
                        <h3>Review</h3>
                        <p>0</p>
                    </div>

                    <div class="task-column completed">
                        <h3>Completed</h3>
                        <p>0</p>
                    </div>
                </section>
            </main>
        </div>

        <script src="js/app.js"></script>
    </body>
</html>
