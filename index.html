<!DOCTYPE html>
<html>
    <head>
        <title>TaskFlow</title>
        <link rel="stylesheet" href="css/style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <header>
            <div class="container">
                <p class="logo">TaskFlow</p>
                <button type="button" class="new-proj-btn">+ New</button> <!--Make so drop down can appear for new project or new task to active project-->
            </div>
        </header>

        <div class="container">
            <nav class="dash-nav" aria-label="Main navigation">
                <ul class="nav">
                    <li><a>Dashboard</a></li>
                    <li><a>Projects</a></li>
                    <li><a>Archives</a></li>
                    <li><a>Trash</a></li>
                </ul>
            </nav>

            <main class="dashboard">
                <h1>Dashboard</h1>
                <h2>Statistics</h2>
                <section class="ttl-stats">
                    <div class="stat-card total">
                        <h3>Total</h3>
                        <p>0</p>
                    </div>

                    <div class="stat-card in-progress">
                        <h3>In Progress</h3>
                        <p>0</p>
                    </div>

                    <div class="stat-card review">
                        <h3>Review</h3>
                        <p>0</p>
                    </div>

                    <div class="stat-card completed">
                        <h3>Completed</h3>
                        <p>0</p>
                    </div>
                </section>

                <div class="dash-ctrl">
                    <input type="search" id="task-search" aria-label="Search tasks" placeholder="Search tasks...">

                    <select id="priority-filter" aria-label = "Filter By Priority">
                        <option value="all">All Priorities</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>

                    <select id="status-filter" aria-label = "Filter By Status">
                        <option value="all">All Statuses</option>
                        <option value="todo">To Do</option>
                        <option value="in-progress">In Progress</option>
                        <option value="review">Review</option>
                        <option value="completed">Completed</option>
                    </select>

                    <select id="sort-tasks" aria-label="Sort tasks">
                        <option value="default">Default Order</option>
                        <option value="title-asc">Title (A-Z)</option>
                        <option value="title-desc">Title (Z-A)</option>
                        <option value="priority-desc">Priority (High-Low)</option>
                        <option value="priority-asc">Priority (Low-High)</option>
                        <option value="date-asc">Expected Date (Earliest)</option>
                        <option value="date-desc">Expected Date (Latest)</option>
                    </select>
                </div>

                <h2>Recently Active Project</h2>

                <section class="task-board">
                    <div class="task-column todo" data-status="todo">
                        <h3>To Do</h3>
                        <p class="task-count">1</p>
                        <div class="task-list">
                            
                        </div>
                    </div>

                    <div class="task-column in-progress" data-status="in-progress">
                        <h3>In Progress</h3>
                        <p class="task-count">0</p>
                        <div class="task-list"></div>
                    </div>

                    <div class="task-column review" data-status="review">
                        <h3>Review</h3>
                        <p class="task-count">0</p>
                        <div class="task-list"></div>
                    </div>

                    <div class="task-column completed" data-status="completed">
                        <h3>Completed</h3>
                        <p class="task-count">0</p>
                        <div class="task-list"></div>
                    </div>
                </section>

                <dialog class="task-dialog">
                    <form class="task-form">
                        <fieldset>
                            <legend>New Task</legend>
                            <label for="task-title">Title</label>
                            <input type="text" id="task-title" name="title" required>

                            <label for="task-description">Description</label>
                            <textarea id="task-description" name="description"></textarea>

                            <label for="task-status">Status</label>
                            <select id="task-status" name="status" required>
                                <option value="todo">To Do</option>
                                <option value="in-progress">In Progress</option>
                                <option value="review">Review</option>
                                <option value="completed">Completed</option>
                            </select>

                            <label for="task-priority">Priority</label>
                            <select id="task-priority" name="priority" required>
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>

                            <label for="expected-date">Expected Date</label>
                            <input type="date" id="expected-date" name="expectedDate">

                            <button type="submit" class="new-task-btn">Create Task</button>
                            <button type="button" class="cancel-btn">Cancel</button>
                        </fieldset>
                    </form>
                </dialog>
            </main>
        </div>

        <script src="js/app.js"></script>
    </body>
</html>
