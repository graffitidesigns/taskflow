<!DOCTYPE html>
<html>
    <head>
        <title>TaskFlow</title>
        <link rel="stylesheet" href="css/style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <header>
            <div class="container">
                <p class="logo">TaskFlow</p>
                <button type="button" class="new-proj-btn">+ New</button> <!--Make so drop down can appear for new project or new task to active project-->
            </div>
        </header>

        <div class="container">
            <nav class="dash-nav" aria-label="Main navigation">
                <ul class="nav">
                    <li><a>Dashboard</a></li>
                    <li><a>Projects</a></li>
                    <li><a>Archives</a></li>
                    <li><a>Trash</a></li>
                </ul>
            </nav>

            <main class="dashboard">
                <h1>Dashboard</h1>
                <h2>Statistics</h2>
                <section class="ttl-stats">
                    <div class="stat-card total">
                        <h3>Total</h3>
                        <p>0</p>
                    </div>

                    <div class="stat-card in-progress">
                        <h3>In Progress</h3>
                        <p>0</p>
                    </div>

                    <div class="stat-card review">
                        <h3>Review</h3>
                        <p>0</p>
                    </div>

                    <div class="stat-card completed">
                        <h3>Completed</h3>
                        <p>0</p>
                    </div>
                </section>

                <div class="dash-ctrl">
                    <button type="button" class="ctrl-btn search">Search</button>

                    <button type="button" class="ctrl-btn filter">Filter</button>

                    <button type="button" class="ctrl-btn sort">Sort</button>
                </div>

                <h2>Recently Active Project</h2>

                <section class="task-board">
                    <div class="task-column todo" data-status="todo">
                        <h3>To Do</h3>
                        <p class="task-count">1</p>
                        <div class="task-list">
                            
                        </div>
                    </div>

                    <div class="task-column in-progress" data-status="in-progress">
                        <h3>In Progress</h3>
                        <p class="task-count">0</p>
                        <div class="task-list"></div>
                    </div>

                    <div class="task-column review" data-status="review">
                        <h3>Review</h3>
                        <p class="task-count">0</p>
                        <div class="task-list"></div>
                    </div>

                    <div class="task-column completed" data-status="completed">
                        <h3>Completed</h3>
                        <p class="task-count">0</p>
                        <div class="task-list"></div>
                    </div>
                </section>

                <dialog class="task-dialog">
                    <form class="task-form">
                        <fieldset>
                            <legend>New Task</legend>
                            <label for="task-title">Title</label>
                            <input type="text" id="task-title" name="title" required>

                            <label for="task-description">Description</label>
                            <textarea id="task-description" name="description"></textarea>

                            <label for="task-status">Status</label>
                            <select id="task-status" name="status" required>
                                <option value="todo">To Do</option>
                                <option value="in-progress">In Progress</option>
                                <option value="review">Review</option>
                                <option value="completed">Completed</option>
                            </select>

                            <label for="task-priority">Priority</label>
                            <select id="task-priority" name="priority" required>
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>

                            <label for="expected-date">Expected Date</label>
                            <input type="date" id="expected-date" name="expectedDate">

                            <button type="submit" class="new-task-btn">Create Task</button>
                            <button type="button" class="cancel-btn">Cancel</button>
                        </fieldset>
                    </form>
                </dialog>
            </main>
        </div>

        <script src="js/app.js"></script>
    </body>
</html>
